name: Analyze catalog overlaps

on:
  push:
    paths:
      - '.github/workflows/analyze-catalog-overlaps.yml'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Analyze cross-catalog overlaps
        run: python tools/audit-catalog-overlaps.py

      - name: Commit analysis report
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+happyvm@users.noreply.github.com"
          git add metadata/catalog-overlap-analysis.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "meta: add cross-catalog overlap analysis"
          git push origin HEAD:main
