name: Analyze catalog overlaps

on:
  push:
    paths:
      - '.github/workflows/analyze-catalog-overlaps.yml'
      - 'tools/audit-catalog-overlaps.py'
      - 'tools/audit-catalog-bullet-overlaps.py'

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Normalize overlap analyzer
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tools/audit-catalog-overlaps.py')
          t = p.read_text()
          old = '''    "paid-under-500.md",\n    "paid-over-500.md",\n}'''
          new = '''    "paid-under-500.md",\n    "paid-over-500.md",\n    "tools-platforms-under-500.md",\n    "business-finance-under-500.md",\n}'''
          if old not in t:
              raise SystemExit('aggregator anchor missing')
          t = t.replace(old, new, 1)
          old2 = '''    "observability", "business", "architecture", "platform", "vendor",\n}'''
          new2 = '''    "observability", "business", "architecture", "platform", "vendor",\n    "associate", "professional", "specialist", "expert", "foundational",\n    "practitioner", "registered", "total", "prix officiel",\n}'''
          if old2 not in t:
              raise SystemExit('generic anchor missing')
          t = t.replace(old2, new2, 1)
          p.write_text(t)
          PY

      - name: Analyze table overlaps
        run: python tools/audit-catalog-overlaps.py

      - name: Analyze named bullet overlaps
        run: python tools/audit-catalog-bullet-overlaps.py

      - name: Commit analyzer and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+happyvm@users.noreply.github.com"
          git add tools/audit-catalog-overlaps.py metadata/catalog-overlap-analysis.md metadata/catalog-bullet-overlap-analysis.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "meta: normalize cross-catalog overlap analysis"
          git push origin HEAD:main
