name: Backfill geographic scope metadata

on:
  push:
    paths:
      - '.github/workflows/backfill-geography.yml'

permissions:
  contents: write

jobs:
  backfill:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync scope metadata into legacy frontmatter
        run: python tools/sync-geography.py --sync

      - name: Validate geographic metadata
        run: python tools/sync-geography.py --check

      - name: Commit backfill
        shell: bash
        run: |
          if git diff --quiet -- certifications; then
            echo "No frontmatter changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certifications
          git commit -m "meta: sync geographic scope into certification frontmatter"
          git push origin HEAD:main
