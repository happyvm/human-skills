name: Fill geography from section context

on:
  push:
    paths:
      - '.github/workflows/context-fill-entry-geography.yml'

permissions:
  contents: write

jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fill missing labels
        run: python tools/context-fill-entry-geography.py
      - name: Regenerate entry report
        run: python tools/refine-entry-geography.py --sync
      - name: Regenerate strict audit
        run: python tools/audit-entry-geography.py || true
      - name: Commit results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certifications metadata/entry-geography-report.md metadata/entry-geography-audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "meta: complete geography from credential context"
          git push origin HEAD:main
