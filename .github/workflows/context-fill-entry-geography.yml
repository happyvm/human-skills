name: Fill geography from section context

on:
  push:
    paths:
      - '.github/workflows/context-fill-entry-geography.yml'

permissions:
  contents: write

# Final one-shot pass; this workflow is removed after a clean audit.
jobs:
  fill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize one malformed legacy table row
        shell: python
        run: |
          from pathlib import Path
          p = Path('certifications/paid-over-500.md')
          s = p.read_text(encoding='utf-8')
          old = '| ITIL Foundation + Create, Deliver & Support eLearning depuis zéro | **690 + 1 338 $** | ≈ **1 742 €** | ITSM | 🌍 INT |'
          new = '| ITIL Foundation + Create, Deliver & Support eLearning depuis zéro | **690 + 1 338 $** ≈ **1 742 €** | ITSM | 🌍 INT |'
          p.write_text(s.replace(old, new), encoding='utf-8')
      - name: Fill missing labels and credential tables
        run: python tools/context-fill-entry-geography.py
      - name: Resolve reviewed UNV entries and regenerate report
        run: python tools/refine-entry-geography.py --sync
      - name: Regenerate strict audit
        run: python tools/audit-entry-geography.py || true
      - name: Commit results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certifications metadata/entry-geography-report.md metadata/entry-geography-audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "meta: finish entry geography classification"
          git push origin HEAD:main
