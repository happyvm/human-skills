name: Refresh entrepreneur transfer geography

on:
  push:
    paths:
      - '.github/workflows/refresh-transfer-franchise-geography.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refresh entry geography report
        run: python tools/refine-entry-geography.py --sync
      - name: Audit geography
        run: python tools/audit-entry-geography.py
      - name: Commit reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/entry-geography-report.md metadata/entry-geography-audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "meta: refresh transfer franchise entry geography"
          git push origin HEAD:main
