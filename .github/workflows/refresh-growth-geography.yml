name: Refresh entrepreneur growth geography

on:
  push:
    paths:
      - '.github/workflows/refresh-growth-geography.yml'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Clarify local-scope exclusions
        shell: python
        run: |
          from pathlib import Path
          p = Path('certifications/entrepreneur-growth-finance-ecommerce-ip-2026.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('| Credential / formation étrangère | Pourquoi prudence |\n|---|---|\n| US securities licensing / FINRA | réglementation financière US |\n| US tax credentials | fiscalité US |\n| Canadian bankruptcy modules | droit canadien |\n| US collections law credentials | recouvrement / consumer law local |\n| US patent attorney routes | qualification juridique locale |', '| Exemple / formation étrangère | Pourquoi prudence | Portée |\n|---|---|:---:|\n| US securities licensing / FINRA | réglementation financière US | 🇺🇸 US |\n| US tax credentials | fiscalité US | 🇺🇸 US |\n| Canadian bankruptcy modules | droit canadien | 🇨🇦 CA |\n| US collections law credentials | recouvrement / consumer law local | 🇺🇸 US |\n| US patent attorney routes | qualification juridique locale | 🇺🇸 US |')
          p.write_text(s, encoding='utf-8')
      - name: Refresh entry geography report
        run: python tools/refine-entry-geography.py --sync
      - name: Audit geography
        run: python tools/audit-entry-geography.py
      - name: Commit results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certifications/entrepreneur-growth-finance-ecommerce-ip-2026.md metadata/entry-geography-report.md metadata/entry-geography-audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "meta: complete growth entry geography"
          git push origin HEAD:main
