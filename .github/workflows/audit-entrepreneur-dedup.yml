name: Audit entrepreneur dedup

on:
  push:
    paths:
      - '.github/workflows/audit-entrepreneur-dedup.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit canonical entrepreneur ownership
        run: python tools/audit-entrepreneur-duplicates.py

      - name: Refresh geography report
        run: python tools/refine-entry-geography.py --sync

      - name: Audit geography
        run: python tools/audit-entry-geography.py

      - name: Commit reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add metadata/entrepreneur-duplicate-audit.md metadata/entry-geography-report.md metadata/entry-geography-audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "meta: refresh entrepreneur dedup and geography audits"
          git push origin HEAD:main
