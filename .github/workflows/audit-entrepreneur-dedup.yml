name: Audit entrepreneur dedup

on:
  push:
    paths:
      - '.github/workflows/audit-entrepreneur-dedup.yml'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Remove remaining non-canonical detail rows
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
            'certifications/entrepreneur-bank-connectivity-sellside-procurement-facilities-fleet-2026.md': {
              '| Modèle / valuation | CFI FMVA / IB & PE Modeling | CERT | HAUTE | 🌍 INT |':
              '| Modèle / valuation | voir parcours finance / valuation canonique | ROUTE | HAUTE | 🌍 INT |',
              '| Process M&A | IMAA International M&A Expert | CERT | HAUTE si deals répétés | 🌍 INT |':
              '| Process M&A | voir catalogue CorpDev / M&A canonique | ROUTE | HAUTE si deals répétés | 🌍 INT |',
              '| Carve-out / TSA | IMAA SCDE | CERT / in-house | HAUTE si périmètre à séparer | 🌍 INT |':
              '| Carve-out / TSA | voir catalogue carve-out / TSA canonique | ROUTE | HAUTE si périmètre à séparer | 🌍 INT |',
              '| Contrats | WorldCC CCM | CERT | HAUTE B2B complexe | 🌍 INT |':
              '| Contrats | voir catalogue contract management canonique | ROUTE | HAUTE B2B complexe | 🌍 INT |',
            },
            'certifications/entrepreneur-eta-family-ess-export-regulated-2026.md': {
              "| Reprise France | CCI France RS7413 — Reprise d'entreprise | CERT | **≈1 650–1 695 €** selon CCI observée | TRÈS HAUTE | 🇫🇷 FR |":
              '| Reprise France | voir catalogue reprise canonique | ROUTE | — | TRÈS HAUTE | 🇫🇷 FR |',
              '| Franchise | IFA Foundations of Franchising | COURSE | **2 400 $** | HAUTE si réseau structuré | 🌍 INT · US-origin |':
              '| Franchise | voir catalogue franchise canonique | ROUTE | — | HAUTE si réseau structuré | 🌍 INT · US-origin |',
              '| Franchise | IFA Certified Franchise Executive — CFE | CERT / designation | TCO multi-composants | HAUTE si franchiseur / multi-unit | 🌍 INT · US-origin |':
              '| Franchise avancée | voir catalogue franchise canonique | ROUTE | — | HAUTE si franchiseur / multi-unit | 🌍 INT · US-origin |',
            },
            'certifications/entrepreneur-group-finance-private-credit-pmi-corpdev-2026.md': {
              '| LBO / dette | CFA Institute Private Equity Certificate | CERT | **890 $** | TRÈS HAUTE | 🌍 INT |':
              '| LBO / dette | voir catalogue holding / LBO canonique | ROUTE | — | TRÈS HAUTE | 🌍 INT |',
              '| Dette / gouvernance PE avancée | CFA Institute Advanced Private Equity Certificate | CERT | **890 $** après PE Certificate | HAUTE / premium | 🌍 INT |':
              '| Dette / gouvernance PE avancée | voir catalogue holding / LBO canonique | ROUTE | — | HAUTE / premium | 🌍 INT |',
              '| Crédit bancaire / dette | CFI CBCA® | CERT | **497 $/an Self-Study** standard | TRÈS HAUTE | 🌍 INT |':
              '| Crédit bancaire / dette | voir catalogue croissance / crédit canonique | ROUTE | — | TRÈS HAUTE | 🌍 INT |',
            },
            'certifications/entrepreneur-treasury-cash-pooling-epm-carveout-2026.md': {
              '| Dette / crédit | CFI CBCA® | CERT | **497 $/an Self-Study** standard | TRÈS HAUTE | 🌍 INT |':
              '| Dette / crédit | voir catalogue croissance / crédit canonique | ROUTE | — | TRÈS HAUTE | 🌍 INT |',
              '| FP&A / board reporting | CFI FPAP™ | CERT | **497 $/an Self-Study** standard | TRÈS HAUTE | 🌍 INT |':
              '| FP&A / board reporting | voir catalogue finance groupe canonique | ROUTE | — | TRÈS HAUTE | 🌍 INT |',
              '| IFRS entrée | ACCA CertIFR | CERT | **310 £** cours + assessment ; **200 £ assessment only** | HAUTE | 🌍 INT · UK-origin |':
              '| IFRS entrée | voir catalogue finance groupe canonique | ROUTE | — | HAUTE | 🌍 INT · UK-origin |',
            },
          }

          for filename, reps in replacements.items():
              path = Path(filename)
              text = path.read_text()
              for old, new in reps.items():
                  if old not in text:
                      raise SystemExit(f'missing expected row in {filename}: {old}')
                  text = text.replace(old, new)
              path.write_text(text)
          PY

      - name: Audit canonical entrepreneur ownership
        run: python tools/audit-entrepreneur-duplicates.py

      - name: Refresh geography report
        run: python tools/refine-entry-geography.py --sync

      - name: Audit geography
        run: python tools/audit-entry-geography.py

      - name: Commit changes and reports
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add certifications/entrepreneur-bank-connectivity-sellside-procurement-facilities-fleet-2026.md \
                  certifications/entrepreneur-eta-family-ess-export-regulated-2026.md \
                  certifications/entrepreneur-group-finance-private-credit-pmi-corpdev-2026.md \
                  certifications/entrepreneur-treasury-cash-pooling-epm-carveout-2026.md \
                  metadata/entrepreneur-duplicate-audit.md \
                  metadata/entry-geography-report.md metadata/entry-geography-audit.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "refactor: enforce canonical entrepreneur credential ownership"
          git push origin HEAD:main
